name: Refresh rides

on:
  workflow_dispatch:
  schedule:
    # 00:00 Asia/Shanghai. GitHub cron is UTC; China has no DST.
    - cron: "0 16 * * *"

concurrency:
  group: refresh-rides
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: backend

      - name: Restore downloaded rides
        uses: actions/cache@v6
        with:
          path: |
            backend/data/raw
            backend/data/activities.db
          key: rides-${{ github.run_id }}
          restore-keys: |
            rides-

      - name: Fetch, parse, and export
        working-directory: backend
        env:
          IGPSPORT_PHONE: ${{ secrets.IGPSPORT_PHONE }}
          IGPSPORT_PASSWORD: ${{ secrets.IGPSPORT_PASSWORD }}
        run: make refresh

      - name: Commit activities
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ":card_file_box: chore(data): refresh activities json"
          file_pattern: data/activities.json
