name: Refresh Rides

on:
  workflow_dispatch:
    inputs:
      rebuild_from_scratch:
        description: Ignore downloaded rides cache for this run
        type: boolean
        default: false
      delete_cache:
        description: Delete downloaded rides cache from GitHub Actions
        type: boolean
        default: false
  schedule:
    # 00:00 Asia/Shanghai. GitHub cron is UTC; China has no DST.
    - cron: "0 16 * * *"

concurrency:
  group: refresh-rides
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: backend

      - name: Delete downloaded rides cache
        if: ${{ inputs.delete_cache }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          while :; do
            ids="$(gh cache list --key rides-v2- --limit 100 --json id --jq '.[].id')"
            if [ -z "$ids" ]; then
              break
            fi
            for id in $ids; do
              gh cache delete "$id"
              deleted=$((deleted + 1))
            done
          done
          if [ "$deleted" -eq 0 ]; then
            echo "No rides cache to delete."
          else
            echo "Deleted $deleted rides cache(s)."
          fi

      - name: Restore downloaded rides
        if: ${{ !inputs.rebuild_from_scratch }}
        uses: actions/cache@v6
        with:
          path: |
            backend/data/raw
            backend/data/activities.db
          # Bump this namespace after a destructive raw-data or DB schema change.
          key: rides-v2-${{ github.run_id }}
          restore-keys: |
            rides-v2-

      - name: Fetch, parse, and export
        working-directory: backend
        env:
          IGPSPORT_PHONE: ${{ secrets.IGPSPORT_PHONE }}
          IGPSPORT_PASSWORD: ${{ secrets.IGPSPORT_PASSWORD }}
        run: make refresh

      - name: Commit activities
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ":card_file_box: chore(data): refresh activities json"
          file_pattern: data/activities.json data/rides/*.json
