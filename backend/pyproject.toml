[project]
name = "igpsport-sync"
version = "0.1.0"
description = "Download iGPSPORT FIT files and import them into SQLite."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [{ name = "Guoqi Sun" }]
dependencies = [
    "garmin-fit-sdk>=21.218.0",
    "httpx>=0.27",
    "polyline>=2.0.4",
]

[project.scripts]
igpsport-sync = "igpsport.data_sync:main"
fit-parse = "igpsport.fit_data_parse:main"
strava-sync = "strava.data_sync:main"
strava-parse = "strava.strava_data_parse:main"
export-activities = "shared.export_db_to_json:main"

[tool.hatch.build.targets.wheel]
packages = ["igpsport", "strava", "shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["black>=24", "pytest>=8", "ruff>=0.6"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["igpsport", "strava", "shared", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["igpsport", "strava", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
