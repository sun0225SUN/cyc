[project]
name = "igpsport-sync"
version = "0.1.0"
description = "Download iGPSPORT FIT files and import them into SQLite."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [{ name = "Guoqi Sun" }]
dependencies = [
    "garmin-fit-sdk>=21.218.0",
    "httpx>=0.27",
    "polyline>=2.0.4",
]

[project.scripts]
igpsport-sync = "igpsport_sync:main"
fit-parse = "fit_parse:main"
export-activities = "export_activities:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/igpsport_sync.py", "src/fit_parse.py", "src/export_activities.py"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["black>=24", "pytest>=8", "ruff>=0.6"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["export_activities", "fit_parse", "igpsport_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
