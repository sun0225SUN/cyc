[project]
name = "igpsport-sync"
version = "0.1.0"
description = "Download original FIT files from iGPSPORT."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [{ name = "Guoqi Sun" }]
dependencies = ["httpx>=0.27"]

[project.scripts]
igpsport-sync = "igpsport_sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["black>=24", "pytest>=8", "ruff>=0.6"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["igpsport_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
