pre-commit:
  commands:
    tailwind-fix:
      glob: "*.{tsx,jsx,html,vue,svelte,astro}"
      run: bunx tailwind-lint --config src/_app/styles/globals.css --fix {staged_files}
      stage_fixed: true

    format-staged:
      glob: "*.{js,cjs,mjs,jsx,ts,cts,mts,tsx,json,jsonc,css}"
      run: bunx biome format --write {staged_files}
      stage_fixed: true

    python-lint:
      glob: "*.py"
      run: uv run --project backend ruff check {staged_files} && uv run --project backend black --check {staged_files}

commit-msg:
  commands:
    validate-commit-message:
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    test:
      run: bun run test

    python-test:
      glob: "backend/**"
      run: uv run --directory backend pytest
